<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Activity</title>
<style>
:root { --l0:#ebedf0; --l1:#9be9a8; --l2:#40c463; --l3:#30a14e; --l4:#216e39; --text:#57606a; --strong:#24292f; --tip:#24292f; --tip-text:#fff; }
@media (prefers-color-scheme: dark) {
  :root { --l0:#2d333b; --l1:#0e4429; --l2:#006d32; --l3:#26a641; --l4:#39d353; --text:#9198a1; --strong:#e6edf3; --tip:#e6edf3; --tip-text:#1f2328; }
}
* { box-sizing: border-box; }
body { margin: 0; padding: 8px 32px; background: transparent; color: var(--text); font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
#total { margin: 0 0 8px; font-size: 14px; color: var(--strong); }
#filters { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
#filters:empty { display: none; }
#filters button { padding: 2px 10px; border: 1px solid var(--l0); border-radius: 999px; background: transparent; color: var(--text); font: inherit; cursor: pointer; }
#filters button[aria-pressed="true"] { border-color: var(--strong); background: var(--strong); color: var(--tip-text); }
svg { display: block; width: 100%; height: auto; }
svg text { fill: var(--text); font-size: 9px; }
.cell { rx: 2; ry: 2; }
.l0 { fill: var(--l0); } .l1 { fill: var(--l1); } .l2 { fill: var(--l2); } .l3 { fill: var(--l3); } .l4 { fill: var(--l4); }
#legend { display: flex; justify-content: flex-end; align-items: center; gap: 3px; margin-top: 6px; }
#legend i { width: 10px; height: 10px; border-radius: 2px; }
#tip { position: fixed; display: none; padding: 4px 8px; border-radius: 4px; background: var(--tip); color: var(--tip-text); pointer-events: none; white-space: nowrap; }
</style>
</head>
<body>
<p id="total"></p>
<div id="filters"></div>
<svg id="grid" role="img" aria-label="Календарь активности"></svg>
<div id="legend">Меньше <i style="background:var(--l0)"></i><i style="background:var(--l1)"></i><i style="background:var(--l2)"></i><i style="background:var(--l3)"></i><i style="background:var(--l4)"></i> Больше</div>
<div id="tip"></div>
<script>
const DATA = {"2026-11-02": {"Upwork": 4}, "2026-11-05": {"LinkedIn": 2}, "2026-11-06": {"LinkedIn": 1}, "2026-11-09": {"LinkedIn": 3}};
const CELL = 10, GAP = 3, STEP = CELL + GAP, LEFT = 24, TOP = 14, WEEKS = 53;
const MONTHS = ["янв", "фев", "мар", "апр", "май", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
const MONTHS_GEN = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("grid"), tip = document.getElementById("tip");
svg.setAttribute("viewBox", `0 0 ${LEFT + WEEKS * STEP} ${TOP + 7 * STEP}`);

const key = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const level = n => n === 0 ? 0 : n === 1 ? 1 : n === 2 ? 2 : n <= 4 ? 3 : 4;
const add = (tag, attrs, text) => {
  const el = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  if (text) el.textContent = text;
  return svg.appendChild(el);
};

const today = new Date(); today.setHours(0, 0, 0, 0);
const start = new Date(today);
start.setDate(today.getDate() - ((today.getDay() + 6) % 7) - (WEEKS - 1) * 7);  // Monday, 52 weeks back

[["Пн", 0], ["Ср", 2], ["Пт", 4]].forEach(([label, row]) => add("text", { x: 0, y: TOP + row * STEP + 8 }, label));

const countOn = (date, source) => {
  const day = DATA[date] || {};
  return source ? day[source] || 0 : Object.values(day).reduce((sum, n) => sum + n, 0);
};

const cells = [];
let lastMonth = -1;
for (let d = new Date(start), i = 0; d <= today; d.setDate(d.getDate() + 1), i++) {
  const week = Math.floor(i / 7), day = i % 7;
  if (day === 0 && d.getMonth() !== lastMonth) {
    if (week < WEEKS - 2) add("text", { x: LEFT + week * STEP, y: 9 }, MONTHS[d.getMonth()]);
    lastMonth = d.getMonth();
  }
  const cell = {
    date: key(d), count: 0, label: `${d.getDate()} ${MONTHS_GEN[d.getMonth()]} ${d.getFullYear()}`,
    rect: add("rect", { x: LEFT + week * STEP, y: TOP + day * STEP, width: CELL, height: CELL }),
  };
  cell.rect.addEventListener("mousemove", e => {
    tip.textContent = `${cell.count} — ${cell.label}`; tip.style.display = "block";
    tip.style.left = Math.min(e.clientX + 10, innerWidth - tip.offsetWidth - 4) + "px";
    tip.style.top = (e.clientY - 30) + "px";
  });
  cell.rect.addEventListener("mouseleave", () => { tip.style.display = "none"; });
  cells.push(cell);
}

const filters = document.getElementById("filters");
const show = source => {
  let total = 0;
  for (const cell of cells) {
    cell.count = countOn(cell.date, source);
    total += cell.count;
    cell.rect.setAttribute("class", `cell l${level(cell.count)}`);
  }
  document.getElementById("total").textContent = `${total} за последний год`;
  filters.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.source === source));
};

const sources = [...new Set(Object.values(DATA).flatMap(Object.keys))].sort();
if (sources.length > 1) {
  for (const [text, source] of [["Все", ""], ...sources.map(s => [s, s])]) {
    const button = document.createElement("button");
    button.type = "button"; button.textContent = text; button.dataset.source = source;
    button.addEventListener("click", () => show(source));
    filters.append(button);
  }
}
show("");
</script>
</body>
</html>
